# BTCL-SMS Cluster Configuration
# Tenant-specific settings for BTCL SMS cluster
# Deployment mode: MONITOR-ONLY (no auto-heal / no sudo actions)

cluster.tenant=btcl-sms
cluster.name=btcl-sms-kafka-cluster

# Monitor-only: agent observes and exposes APIs, takes NO healing/sudo actions
cluster.auto-heal-enabled=false

# Kafka cluster (broker overlay IPs, reachable from host via wg-overlay)
cluster.kafka.bootstrap-servers=10.10.199.20:9092,10.10.198.20:9092,10.10.197.20:9092
cluster.kafka.expected-brokers=3

# Kafka broker nodes (for REST API / connectivity queries)
cluster.nodes.node1.id=1
cluster.nodes.node1.host-ip=10.10.199.20
cluster.nodes.node1.overlay-ip=10.10.199.20
cluster.nodes.node1.services[0].name=kafka
cluster.nodes.node1.services[0].type=docker
cluster.nodes.node1.services[0].container=kafka
cluster.nodes.node1.services[0].port=9092

cluster.nodes.node2.id=2
cluster.nodes.node2.host-ip=10.10.198.20
cluster.nodes.node2.overlay-ip=10.10.198.20
cluster.nodes.node2.services[0].name=kafka
cluster.nodes.node2.services[0].type=docker
cluster.nodes.node2.services[0].container=kafka
cluster.nodes.node2.services[0].port=9092

cluster.nodes.node3.id=3
cluster.nodes.node3.host-ip=10.10.197.20
cluster.nodes.node3.overlay-ip=10.10.197.20
cluster.nodes.node3.services[0].name=kafka
cluster.nodes.node3.services[0].type=docker
cluster.nodes.node3.services[0].container=kafka
cluster.nodes.node3.services[0].port=9092

# NMS - Network Monitoring Service
nms.enabled=true

# NMS - Kafka monitoring
nms.kafka.cluster-id=btcl-sms
nms.kafka.bootstrap-servers=10.10.199.20:9092,10.10.198.20:9092,10.10.197.20:9092

# NMS - MySQL instance to monitor (btcl_sms on percona_mysql, local to this host)
# Use 127.0.0.1: a host->bond-IP connection appears to MySQL as source 10.246.7.102
# (not granted), whereas 127.0.0.1 is NATed by docker to gateway 172.17.0.1 (granted).
nms.mysql[0].id=btcl-sms-mysql
nms.mysql[0].host=127.0.0.1
nms.mysql[0].port=3306
nms.mysql[0].database=btcl_sms
nms.mysql[0].username=tbuser
nms.mysql[0].password=Takay1takaane$
nms.mysql[0].role=master
