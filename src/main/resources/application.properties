# Cluster Watchdog - Main Configuration
# Active tenant profile (set during deployment)
quarkus.profile=bdcom

# Application
quarkus.application.name=cluster-watchdog
quarkus.http.port=8090

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.telcobright.watchdog".level=DEBUG

# Scheduler intervals
watchdog.check-interval=60s
watchdog.kafka-check-interval=120s
watchdog.bgp-check-interval=300s

# Local node config - override via environment variables during deployment
# WATCHDOG_NODE_ID, WATCHDOG_OVERLAY_IP, WATCHDOG_WG_INTERFACE
cluster.local.node-id=${WATCHDOG_NODE_ID:1}
cluster.local.overlay-ip=${WATCHDOG_OVERLAY_IP:}
cluster.local.wire-guard-interface=${WATCHDOG_WG_INTERFACE:wg0}
cluster.local.bridge=lxdbr0
cluster.local.frr-container=frr-router
cluster.local.kafka-ip-service=lxdbr0-kafka-ip

# Snap management
cluster.snap.hold-lxd-refresh=true

# Auto-healing
cluster.auto-heal-enabled=true

# NMS - Network Monitoring Service
nms.enabled=true
