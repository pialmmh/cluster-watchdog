# Link3 Cluster Configuration
# Tenant-specific settings for Link3 Kafka cluster

cluster.tenant=link3
cluster.name=link3-kafka-cluster

# Kafka cluster (Node1=10.10.197.20, Node2=10.10.198.20, Node3=10.10.199.20)
cluster.kafka.bootstrap-servers=10.10.197.20:9092,10.10.198.20:9092,10.10.199.20:9092
cluster.kafka.expected-brokers=3

